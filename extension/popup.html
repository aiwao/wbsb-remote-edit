<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Remote Edit</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="topbar">
        <h1>Remote Edit</h1>
        <span id="status" class="status is-offline">Offline</span>
      </header>

      <label class="field">
        <span>Endpoint</span>
        <input id="endpoint" type="url" value="ws://127.0.0.1:8787/ws" spellcheck="false" />
      </label>

      <label class="switch-control">
        <input id="auto-connect" type="checkbox" role="switch" />
        <span class="switch-track" aria-hidden="true">
          <span class="switch-thumb"></span>
        </span>
        <span class="switch-label">Auto connect</span>
      </label>

      <section class="edit-view" aria-live="polite">
        <h2 id="edit-title" class="edit-title">No edit yet</h2>
        <pre id="edit-content" class="edit-content"></pre>
      </section>

      <section class="log-shell" aria-label="Message log">
        <div id="log" class="log"></div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
