name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(nix run .#version)"
          if [ -z "${version}" ]; then
            echo "::error::nix run .#version returned an empty version."
            exit 1
          fi
          tag="v${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version}"

      - name: Stop if tag exists
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists."
            exit 1
          fi

      - name: Build with Nix
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build
          nix build .# -o build/release

      - name: Prepare extension source
        id: extension-source
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$(readlink -f build/release)"
          extension_src="${release_dir}/extension"
          extension_dir="${RUNNER_TEMP}/wbsb-remote-edit-extension"

          rm -rf "${extension_dir}"
          cp -R "${extension_src}" "${extension_dir}"
          chmod -R u+w "${extension_dir}"

          echo "dir=${extension_dir}" >> "$GITHUB_OUTPUT"

      - name: Validate extension
        shell: bash
        env:
          EXTENSION_DIR: ${{ steps.extension-source.outputs.dir }}
        run: |
          set -euo pipefail

          nix develop --command web-ext lint --source-dir "${EXTENSION_DIR}"

      - name: Package CLI
        id: cli
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p artifacts
          build_script="${RUNNER_TEMP}/build-cli-assets.sh"
          cat > "${build_script}" <<'BASH'
            set -euo pipefail

            version="$1"
            build_root="${RUNNER_TEMP}/wbsb-remote-edit-cli"
            targets=(
              linux/amd64
              linux/arm64
              darwin/amd64
              darwin/arm64
              windows/amd64
              windows/arm64
            )

            rm -rf "${build_root}"
            mkdir -p "${build_root}"

            for target in "${targets[@]}"; do
              IFS=/ read -r goos goarch <<< "${target}"
              target_dir="${build_root}/${goos}-${goarch}"
              mkdir -p "${target_dir}"

              binary="wbsb-remote-edit"
              if [ "${goos}" = "windows" ]; then
                binary="${binary}.exe"
              fi

              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
                go build -trimpath -ldflags="-s -w" \
                -o "${target_dir}/${binary}" ./cmd/wbsb-remote-edit

              if [ "${goos}" = "windows" ]; then
                asset_name="wbsb-remote-edit-cli-${version}-${goos}-${goarch}.zip"
                (
                  cd "${target_dir}"
                  zip -q "${GITHUB_WORKSPACE}/artifacts/${asset_name}" "${binary}"
                )
              else
                asset_name="wbsb-remote-edit-cli-${version}-${goos}-${goarch}.tar.gz"
                tar -C "${target_dir}" -czf "${GITHUB_WORKSPACE}/artifacts/${asset_name}" "${binary}"
              fi
            done
          BASH

          nix develop --command bash "${build_script}" "${VERSION}"

      - name: Package Firefox extension
        id: firefox
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXTENSION_DIR: ${{ steps.extension-source.outputs.dir }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${WEB_EXT_API_KEY}" ]; then
            echo "::error::FIREFOX_API_KEY must contain the addons.mozilla.org API key / JWT issuer."
            exit 1
          fi
          if [ -z "${WEB_EXT_API_SECRET}" ]; then
            echo "::error::FIREFOX_API_SECRET must contain the addons.mozilla.org API secret / JWT secret."
            exit 1
          fi

          asset_name="wbsb-remote-edit-firefox-${VERSION}.xpi"
          signed_dir="${RUNNER_TEMP}/web-ext-signed"

          rm -rf "${signed_dir}"
          mkdir -p "${signed_dir}" artifacts
          nix develop --command web-ext sign \
            --api-key "${WEB_EXT_API_KEY}" \
            --api-secret "${WEB_EXT_API_SECRET}" \
            --source-dir "${EXTENSION_DIR}" \
            --artifacts-dir "${signed_dir}" \
            --channel unlisted

          mapfile -t signed_xpis < <(find "${signed_dir}" -maxdepth 1 -type f -name '*.xpi' | sort)
          if [ "${#signed_xpis[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed XPI in ${signed_dir}, found ${#signed_xpis[@]}."
            exit 1
          fi
          mv "${signed_xpis[0]}" "artifacts/${asset_name}"

          echo "asset=artifacts/${asset_name}" >> "$GITHUB_OUTPUT"

      - name: Package Chrome extension
        id: chrome-extension
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXTENSION_DIR: ${{ steps.extension-source.outputs.dir }}
        run: |
          set -euo pipefail

          asset_name="wbsb-remote-edit-chrome-${VERSION}.zip"
          mkdir -p artifacts
          (
            cd "${EXTENSION_DIR}"
            zip -r "${GITHUB_WORKSPACE}/artifacts/${asset_name}" .
          )
          echo "asset=artifacts/${asset_name}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" >/dev/null 2>&1 ||
            git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag or release ${TAG} already exists."
            exit 1
          fi

          shopt -s nullglob
          assets=(artifacts/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release artifacts were created."
            exit 1
          fi

          gh release create "${TAG}" \
            "${assets[@]}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes
